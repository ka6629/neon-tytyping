<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ネオンタイピング自動タイパー</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      width: 280px;
      color: #111;
      background: #080b12;
    }
    .popup {
      padding: 16px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 1rem;
      line-height: 1.3;
      color: #f5f8ff;
    }
    p {
      margin: 0 0 12px;
      color: #c7d0f4;
    }
    .control-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.88rem;
      color: #a8b3df;
    }
    input[type="range"] {
      width: 100%;
    }
    #speed-value {
      color: #7afcff;
      font-weight: 700;
    }
    button {
      width: 100%;
      padding: 10px 12px;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      cursor: pointer;
      margin-bottom: 8px;
    }
    button#start {
      background: #22c55e;
      color: #08120b;
    }
    button#stop {
      background: #ef4444;
      color: #fff;
    }
    #status {
      margin-top: 8px;
      font-size: 0.82rem;
      color: #d1d5db;
      min-height: 1.2em;
    }
  </style>
</head>
<body>
  <div class="popup">
    <h1>ネオンタイピング自動タイパー</h1>
    <p>対象ページを開くと自動的に裏で動作します。必要なら速度を調整したり、停止ボタンで一時停止できます。</p>

    <div class="control-group">
      <label>タイプ速度: <span id="speed-value">0ms</span></label>
      <input id="speed" type="range" min="0" max="200" value="0" />
    </div>

    <button id="start">開始</button>
    <button id="stop">停止</button>
    <div id="status">拡張機能を起動してください。</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
